<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue Propriedade Computada</title>
</head>
<body>
    <div id="app">
        <h1>Todos</h1>
        <input type="text" v-model="task">
        <input type="checkbox" v-model="option">
        <button type="button" @click="addTask">Add task</button>
        <hr>
        Lista To Do
        <ul>
            <li v-for="todo in todos" :key="todo.task">
                <input type="checkbox" v-model="todo.completed">
                {{ todo.task }}
            </li>
        </ul>
        Lista To Do (completed)
        <ul>
            <li v-for="todo in completed" :key="todo.task">
                {{ todo.task }}
            </li>
        </ul>
        Lista To Do (unCompleted)
        <ul>
            <li v-for="todo in unCompleted" :key="todo.task">
                {{ todo.task }}
            </li>
        </ul>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
        const { createApp, ref, computed } = Vue

        createApp({
            setup() {

                const first_name = ref('Luiz')
                const last_name = ref('Lins')
                const full_name = computed(() => {
                    return `${first_name.value} ${last_name.value}`
                })

                const todos = ref([
                    { task: 'tarefa 01', completed: true },
                    { task: 'tarefa 02', completed: true },
                    { task: 'tarefa 03', completed: false },
                    { task: 'tarefa 04', completed: true },
                    { task: 'tarefa 05', completed: true },
                ])

                const unCompleted = computed(() => {
                    return (todos.value).filter((task) => !task.completed)
                })

                const completed = computed(() => {
                    return (todos.value).filter((task) => task.completed)
                })

                const task = ref('')
                const option = ref('')

                const addTask = () => {
                    (todos.value).push({task: task.value, completed: option.value})
                }

                return {
                    option,
                    addTask,
                    task,
                    completed,
                    unCompleted,
                    todos,
                    first_name,
                    last_name,
                    full_name
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
