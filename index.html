<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vue Init</title>
    <style>
        .time {
            background-color: aqua;
            padding: 3px;
        }
    </style>
</head>
<body>
    <div id="app">
        <user-profile>Admin</user-profile>
        <user-profile>
            <template v-slot="contexto">Esse texto vai dentro do slot contexto</template>
        </user-profile>
        <user-profile v-slot="contexto">teste</user-profile>
        <user-profile></user-profile>
        <user-profile></user-profile>
        <user-profile></user-profile>
    </div>

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script>
        const { createApp, ref, defineComponent } = Vue

        const UserProfile = defineComponent({
            name: 'UserProfile',
            setup() {
                const username = ref('Usuario 01')
                return {
                    username
                }
            },
            template: `{{ username }} <slot/> <div><slot name='contexto'/></div> <br/>`
        })

        createApp({
            components: {
                UserProfile
            },
            setup() {

                return {
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
